services:
  postgres:
    image: postgres:16
    container_name: postgres-doula
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: doula_manager
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres_initialize_schema.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/doula_manager
      - JWT_SECRET_KEY=change_this_to_a_secure_secret_in_production
      - JWT_ALGORITHM=HS256
      - JWT_EXPIRES_MINUTES=60
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8081:80"
    depends_on:
      - backend

volumes:
  postgres_data:
